name: recipe-website

services:
  backend:
    build:
      context: .
      target: backend
    env_file:
      - ./deploy/server.env
    environment:
      OUR_KITCHEN_DATABASE_URL: sqlite:////data/our-kitchen.sqlite3
      OUR_KITCHEN_MEDIA_ROOT: /media
    volumes:
      - /var/lib/recipe-website:/data
      - /paulwall/discoball/media/recipe-website:/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
